name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Image to ACR
        run: |
          az acr login --name acrtaskflow5799
          docker build -t acrtaskflow5799.azurecr.io/taskflow-api:${{ github.sha }} .
          docker push acrtaskflow5799.azurecr.io/taskflow-api:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ca-taskflow-api \
            --resource-group rg-taskflow-dev \
            --image acrtaskflow5799.azurecr.io/taskflow-api:${{ github.sha }}